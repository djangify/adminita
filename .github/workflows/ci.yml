name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["5.2", "6.0"]
        exclude:
          # Django 6.0 requires Python 3.12+
          - django-version: "6.0"
            python-version: "3.10"
          - django-version: "6.0"
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=${{ matrix.django-version }}.0"
          pip install -e ".[dev]"
          pip install django-environ whitenoise

      - name: Run tests
        run: pytest

  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lint tools
        run: pip install ruff black

      - name: Run ruff
        run: ruff check .

      - name: Run black --check
        run: black --check .

  js-tests:
    name: JavaScript tests (autosave)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm test

  clean-install:
    name: Clean install smoke test (README steps) + wheel contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Follow the README from-source steps in a fresh venv
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install -r requirements.txt
          /tmp/fresh/bin/pip install -e .
          /tmp/fresh/bin/python manage.py migrate --noinput
          /tmp/fresh/bin/python manage.py check

      - name: Build wheel and verify packaged files
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for required in (
              "adminita/templates/admin/base.html",
              "adminita/static/adminita/adminita-tailwind.css",
              "adminita/static/adminita/adminita-autosave.js",
          ):
              assert required in names, f"missing from wheel: {required}"
          assert any("licenses/LICENSE" in n for n in names), "license missing from wheel"
          PY
